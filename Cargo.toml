[package]
name = "svg-to-icons"
version = "0.3.0"
edition = "2024"
description = "Convert a single SVG into every icon format an app ships: ICO, ICNS, PNGs, web targets, Android launcher sets, and social banners."
license = "MIT"
repository = "https://github.com/niminypiminy/svg-to-icons"
keywords = ["svg", "icon", "ico", "icns", "android"]
categories = ["command-line-utilities", "multimedia::images", "development-tools"]

[dependencies]
resvg = "0.47.0"
ico = "0.5"
image = "0.25"
clap = { version = "4.6", features = ["derive"] }  # For CLI args

[[bin]]
name = "cargo-svgtoicons"
path = "src/main.rs"
